name: Feature Request
description: Suggest a feature or improvement for develOS.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve develOS.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the problem or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe your proposed solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add anything else that may be useful.